# YouTube の仕様変更で壊れていないかを定期的に確かめる。失敗すると GitHub からメール / アプリ通知が届く
name: smoke

on:
  schedule:
    - cron: "17 0 * * 1" # 毎週月曜 9:17 (JST)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["flow-youtube-chat-lite.user.js", "tests/**", ".github/workflows/smoke.yml"]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps webkit
      - run: npm run test:unit
      - run: npm run test:seek
      - run: npm run test:rewind
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
